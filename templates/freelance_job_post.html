{% include 'freelance_header.html'%}

<center>
    <h1 style="margin-top: 100px;">Post A Job </h1>
    <form method="post">
        {% csrf_token %}
        <table style="margin-top: 50px;">
            <tr><td><input type="text" name="job_title" placeholder="Job Title" class="form-control" required></td></tr>
            <tr><td><input type="text" name="job_description" placeholder="Job Description" class="form-control" required></td></tr>
            <tr><td><input type="text" name="required_skill" placeholder="Required Skill" class="form-control" required></td></tr>
            <tr><td><input type="text" name="expected_duration" placeholder="Expected Duration" class="form-control" required></td></tr>
            <tr><td><input type="text" name="payment" placeholder="Payment" class="form-control" required></td></tr>
            <tr>
                <td>
                    <select name="payment_type" class="form-control" required>
                        <option value="One Time">One Time</option>
                        <option value="Milestone Based">Milestone Based</option>
                        <option value="Hourly">Hourly</option>
                    </select>
                </td>
            </tr>
            <tr><td><input type="hidden" name="freelance_id" value="{{ freelance_id }}"></td></tr>  
            <tr><td colspan="2" align="center"><input type="submit" name="submit" class="btn btn-success"></td></tr>
        </table>
    </form>
</center>

{% include 'footer.html'%}

<style>
    input,select{
        text-align: center;
    }
</style>
