{% include 'admin_header.html'%}


<center>
    <h1 style="margin-top: 100px;">Partime Lists</h1>
    <table class="table" style="margin-top: 50px;">
        <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Company</th>
            <th>Location</th>
      
        </tr>
    </thead>
        {% for i in a %}
        
        <tr>
            <td>{{i.name}}</td>
            <td>{{i.email}}</td>
            <td>{{i.phone}}</td>
            <td>{{i.company}}</td>
            <td>{{i.location}}</td>

            {% if i.login.usertype == 'pending' %}

            <td>
                <a href="/accept-parttime/{{i.login_id}}">Accept</a>
                <a href="/reject-parttime/{{i.login_id}}">Reject</a>
            </td>

            {% endif %}
        </tr>
        {% endfor %}
    </table>
</center>
{% include 'footer.html'%}

<style>
    td{
        color: black;
    }
    th,td{
        text-align: center;
    }
</style>
